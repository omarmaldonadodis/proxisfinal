<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 Proxy Rotation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .btn-success { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }
        .btn-info { background: linear-gradient(135deg, #43e97b, #38f9d7); color: white; }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        /* Stats Cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 48px;
            font-weight: bold;
        }

        .value.green { color: #4ade80; }
        .value.yellow { color: #fbbf24; }
        .value.red { color: #f87171; }

        /* Proxies Grid */
        .proxies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .proxy-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border-left: 5px solid;
            position: relative;
            transition: all 0.3s;
        }

        .proxy-card.healthy { border-color: #4ade80; }
        .proxy-card.degraded { border-color: #fbbf24; }
        .proxy-card.unhealthy { border-color: #f87171; }
        .proxy-card.no-score { border-color: #94a3b8; }

        .proxy-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .proxy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .proxy-location {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.active { background: #fbbf24; color: #000; }
        .badge.failed { background: #f87171; color: #fff; }

        .proxy-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
        }

        /* ✅ LOG CONSOLE (NUEVO) */
        .log-console {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: rgba(0, 0, 0, 0.95);
            border-top: 2px solid #667eea;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform 0.3s;
        }

        .log-console.collapsed {
            transform: translateY(calc(100% - 40px));
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #667eea;
            cursor: pointer;
        }

        .log-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px 10px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
        }

        .log-entry .timestamp {
            color: #94a3b8;
            margin-right: 10px;
        }

        .log-entry.info { border-left: 3px solid #4ade80; }
        .log-entry.warning { border-left: 3px solid #fbbf24; }
        .log-entry.error { border-left: 3px solid #f87171; }
        .log-entry.success { border-left: 3px solid #00f2fe; }

        .clear-log {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .clear-log:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔄 Proxy Rotation Dashboard</h1>
            <p>Monitoreo en tiempo real de rotación inteligente de proxies</p>
            
            <div class="controls" style="margin-top: 20px;">
                <label style="display: flex; align-items: center; gap: 10px;">
                    Auto-actualización:
                    <input type="checkbox" id="autoRefresh" checked style="width: 50px; height: 25px;">
                    <span id="refreshStatus">Activado (30s)</span>
                </label>
                
                <button class="btn btn-success" onclick="refreshData()">
                    🔄 Actualizar Ahora
                </button>
                <button class="btn btn-secondary" onclick="scanAllProxies()">
                    🔍 Escanear Todos
                </button>
                <button class="btn btn-info" onclick="showStats()">
                    📊 Estadísticas
                </button>
                <button class="btn btn-primary" onclick="showLocations()">
                    🗺️ Ubicaciones
                </button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats">
            <div class="stat-card">
                <h3>Total Proxies</h3>
                <div class="value" id="totalProxies">10</div>
            </div>
            <div class="stat-card">
                <h3>Saludables</h3>
                <div class="value green" id="healthyProxies">0</div>
            </div>
            <div class="stat-card">
                <h3>Degradados</h3>
                <div class="value yellow" id="degradedProxies">0</div>
            </div>
            <div class="stat-card">
                <h3>Offline</h3>
                <div class="value red" id="offlineProxies">0</div>
            </div>
        </div>

        <!-- Proxies Grid -->
        <div class="proxies-grid" id="proxiesGrid">
            <!-- Proxies se cargarán aquí -->
        </div>
    </div>

    <!-- ✅ LOG CONSOLE (NUEVO) -->
    <div class="log-console" id="logConsole">
        <div class="log-header" onclick="toggleLog()">
            <span>📋 Console Log</span>
            <button class="clear-log" onclick="clearLog(event)">Limpiar</button>
        </div>
        <div class="log-body" id="logBody">
            <!-- Logs se mostrarán aquí -->
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;

        // ========================================
        // ✅ SISTEMA DE LOGGING VISUAL (NUEVO)
        // ========================================
        function log(message, type = 'info') {
            const logBody = document.getElementById('logBody');
            const timestamp = new Date().toLocaleTimeString();
            
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `
                <span class="timestamp">[${timestamp}]</span>
                <span>${message}</span>
            `;
            
            logBody.appendChild(entry);
            logBody.scrollTop = logBody.scrollHeight;
            
            // Limitar a 100 entradas
            if (logBody.children.length > 100) {
                logBody.removeChild(logBody.firstChild);
            }
        }

        function toggleLog() {
            document.getElementById('logConsole').classList.toggle('collapsed');
        }

        function clearLog(event) {
            event.stopPropagation();
            document.getElementById('logBody').innerHTML = '';
            log('Log limpiado', 'info');
        }

        // ========================================
        // CARGAR DATOS
        // ========================================
        async function refreshData() {
            log('🔄 Actualizando datos...', 'info');
            
            try {
                const response = await fetch('/api/v1/proxy-rotation/rotation-stats');
                const data = await response.json();
                
                // Actualizar contadores
                document.getElementById('totalProxies').textContent = data.total_active;
                document.getElementById('healthyProxies').textContent = data.health_distribution.healthy;
                document.getElementById('degradedProxies').textContent = data.health_distribution.degraded;
                document.getElementById('offlineProxies').textContent = data.total_failed;
                
                // Actualizar grid
                const grid = document.getElementById('proxiesGrid');
                grid.innerHTML = '';
                
                data.proxies_detail.forEach(proxy => {
                    const card = createProxyCard(proxy);
                    grid.appendChild(card);
                });
                
                log(`✅ Datos actualizados: ${data.health_distribution.healthy} saludables, ${data.health_distribution.degraded} degradados`, 'success');
                
            } catch (error) {
                log(`❌ Error al actualizar: ${error.message}`, 'error');
            }
        }

        function createProxyCard(proxy) {
            const card = document.createElement('div');
            card.className = `proxy-card ${proxy.health_status}`;
            
            const scoreDisplay = proxy.score !== null ? proxy.score.toFixed(1) : 'N/A';
            const latencyDisplay = proxy.latency_ms !== null ? `${Math.round(proxy.latency_ms)}ms` : 'N/A';
            const uptimeDisplay = proxy.uptime !== null ? `${proxy.uptime.toFixed(1)}%` : 'N/A';
            
            card.innerHTML = `
                <div class="proxy-header">
                    <div class="proxy-location">
                        📍 ${proxy.location}
                    </div>
                    <span class="badge ${proxy.status}">${proxy.status.toUpperCase()}</span>
                </div>
                
                <div class="proxy-stats">
                    <div class="stat-item">
                        <div class="stat-label">ID</div>
                        <div class="stat-value">#${proxy.id}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Score</div>
                        <div class="stat-value">${scoreDisplay}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Latencia</div>
                        <div class="stat-value">${latencyDisplay}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Uptime</div>
                        <div class="stat-value">${uptimeDisplay}</div>
                    </div>
                </div>
            `;
            
            return card;
        }

        async function scanAllProxies() {
            log('🔍 Iniciando escaneo completo...', 'warning');
            
            try {
                const response = await fetch('/api/v1/proxy-rotation/scan-all', {
                    method: 'POST'
                });
                const data = await response.json();
                
                log(`✅ Escaneo completado: ${data.rotated} rotados, ${data.healthy} saludables`, 'success');
                
                // Refrescar datos
                setTimeout(refreshData, 2000);
                
            } catch (error) {
                log(`❌ Error en escaneo: ${error.message}`, 'error');
            }
        }

        // Auto-refresh
        document.getElementById('autoRefresh').addEventListener('change', (e) => {
            if (e.target.checked) {
                autoRefreshInterval = setInterval(refreshData, 30000);
                document.getElementById('refreshStatus').textContent = 'Activado (30s)';
                log('⏱️ Auto-actualización activada (30s)', 'info');
            } else {
                clearInterval(autoRefreshInterval);
                document.getElementById('refreshStatus').textContent = 'Desactivado';
                log('⏸️ Auto-actualización desactivada', 'warning');
            }
        });

        // Cargar datos inicial
        refreshData();
        autoRefreshInterval = setInterval(refreshData, 30000);
        log('🚀 Dashboard iniciado', 'success');
    </script>
</body>
</html>
