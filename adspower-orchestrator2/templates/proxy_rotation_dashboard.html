<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 Proxy Rotation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #1a1a3e 0%, #2d2d5f 100%);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e1e3f 0%, #2a2a4f 100%);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(102, 126, 234, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-value.healthy {
            color: #38ef7d;
        }

        .stat-value.warning {
            color: #ffc107;
        }

        .stat-value.danger {
            color: #f5576c;
        }

        .stat-label {
            color: #a0a0a0;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        .proxies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .proxy-card {
            background: linear-gradient(135deg, #1e1e3f 0%, #2a2a4f 100%);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }

        .proxy-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .proxy-card.healthy {
            border-left-color: #38ef7d;
        }

        .proxy-card.warning {
            border-left-color: #ffc107;
        }

        .proxy-card.danger {
            border-left-color: #f5576c;
        }

        .proxy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .proxy-location {
            font-weight: bold;
            font-size: 1.2em;
            color: #667eea;
        }

        .proxy-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-online {
            background: rgba(56, 239, 125, 0.2);
            color: #38ef7d;
            border: 1px solid #38ef7d;
        }

        .status-offline {
            background: rgba(245, 87, 108, 0.2);
            color: #f5576c;
            border: 1px solid #f5576c;
        }

        .status-degraded {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid #ffc107;
        }

        .proxy-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .metric-item {
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .metric-label {
            color: #a0a0a0;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .metric-value {
            font-weight: bold;
            font-size: 1.1em;
            color: #e0e0e0;
        }

        .issues-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .issues-title {
            color: #ffc107;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .issue-tag {
            display: inline-block;
            padding: 4px 10px;
            margin: 4px 4px 4px 0;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .issue-tag.critical {
            background: rgba(245, 87, 108, 0.2);
            color: #f5576c;
            border-color: rgba(245, 87, 108, 0.3);
        }

        .loading {
            text-align: center;
            padding: 60px;
            background: linear-gradient(135deg, #1e1e3f 0%, #2a2a4f 100%);
            border-radius: 12px;
            margin: 30px 0;
        }

        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert-info {
            background: rgba(79, 172, 254, 0.2);
            color: #4facfe;
            border-left: 4px solid #4facfe;
        }

        .alert-success {
            background: rgba(56, 239, 125, 0.2);
            color: #38ef7d;
            border-left: 4px solid #38ef7d;
        }

        .alert-warning {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border-left: 4px solid #ffc107;
        }

        .alert-danger {
            background: rgba(245, 87, 108, 0.2);
            color: #f5576c;
            border-left: 4px solid #f5576c;
        }

        .last-update {
            text-align: center;
            color: #a0a0a0;
            margin-top: 30px;
            font-size: 0.9em;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .auto-refresh-toggle {
            position: relative;
            width: 50px;
            height: 24px;
        }

        .auto-refresh-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2a2a4f;
            transition: 0.4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            background: linear-gradient(135deg, #1e1e3f 0%, #2a2a4f 100%);
            border-radius: 12px;
            color: #a0a0a0;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 Proxy Rotation Dashboard</h1>
            <p class="subtitle">Monitoreo en tiempo real de rotación inteligente de proxies</p>
        </header>

        <div class="auto-refresh">
            <span>Auto-actualización:</span>
            <label class="auto-refresh-toggle">
                <input type="checkbox" id="autoRefreshToggle" checked>
                <span class="slider"></span>
            </label>
            <span id="autoRefreshStatus">Activado (30s)</span>
        </div>

        <div class="controls">
            <button class="btn btn-success" onclick="loadProxies()">
                🔄 Actualizar Ahora
            </button>
            <button class="btn btn-primary" onclick="scanAllProxies()">
                🔍 Escanear Todos
            </button>
            <button class="btn btn-info" onclick="getRotationStats()">
                📊 Estadísticas
            </button>
            <button class="btn btn-warning" onclick="getAvailableLocations()">
                🗺️ Ubicaciones
            </button>
        </div>

        <div id="alerts"></div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Total Proxies</div>
                <div class="stat-value" id="totalProxies">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Saludables</div>
                <div class="stat-value healthy" id="healthyProxies">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Degradados</div>
                <div class="stat-value warning" id="degradedProxies">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Offline</div>
                <div class="stat-value danger" id="offlineProxies">-</div>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Cargando datos de proxies...</p>
        </div>

        <div id="proxiesGrid" class="proxies-grid"></div>

        <div class="last-update" id="lastUpdate">
            Última actualización: Nunca
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let autoRefreshInterval = null;
        let proxiesData = [];

        // Auto-refresh toggle
        document.getElementById('autoRefreshToggle').addEventListener('change', function() {
            const status = document.getElementById('autoRefreshStatus');
            if (this.checked) {
                status.textContent = 'Activado (30s)';
                startAutoRefresh();
            } else {
                status.textContent = 'Desactivado';
                stopAutoRefresh();
            }
        });

        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(loadProxies, 30000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        async function loadProxies() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('proxiesGrid');
            
            loading.style.display = 'block';
            grid.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/api/v1/proxy-rotation/health-monitor`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                
                proxiesData = data.proxies || [];
                
                if (proxiesData.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h3>No hay proxies disponibles</h3>
                            <p>No se encontraron proxies activos en el sistema</p>
                        </div>
                    `;
                } else {
                    renderProxies(proxiesData);
                }
                
                updateStats({
                    total: data.total_proxies || 0,
                    healthy: proxiesData.filter(p => p.status === 'online').length,
                    degraded: proxiesData.filter(p => p.status === 'degraded').length,
                    offline: proxiesData.filter(p => p.status === 'offline').length
                });

                updateLastUpdate();
                showAlert('success', '✓ Datos actualizados correctamente');
            } catch (error) {
                console.error('Error cargando proxies:', error);
                showAlert('danger', '✗ Error al cargar datos: ' + error.message);
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Error al cargar datos</h3>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="loadProxies()" style="margin-top: 20px;">
                            Reintentar
                        </button>
                    </div>
                `;
            } finally {
                loading.style.display = 'none';
            }
        }

        function renderProxies(proxies) {
            const grid = document.getElementById('proxiesGrid');
            
            grid.innerHTML = proxies.map(proxy => {
                const statusClass = proxy.status === 'online' ? 'status-online' : 
                                   proxy.status === 'offline' ? 'status-offline' : 'status-degraded';
                
                const cardClass = proxy.status === 'online' ? 'healthy' :
                                 proxy.status === 'offline' ? 'danger' : 'warning';

                const hasIssues = proxy.issues && proxy.issues.length > 0;

                return `
                    <div class="proxy-card ${cardClass}">
                        <div class="proxy-header">
                            <div class="proxy-location">📍 ${proxy.location || 'Desconocido'}</div>
                            <div class="proxy-status ${statusClass}">
                                ${proxy.status || 'unknown'}
                            </div>
                        </div>

                        <div class="proxy-metrics">
                            <div class="metric-item">
                                <div class="metric-label">ID</div>
                                <div class="metric-value">#${proxy.id}</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">Score</div>
                                <div class="metric-value">${proxy.score !== null && proxy.score !== undefined ? proxy.score.toFixed(1) : 'N/A'}</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">Latencia</div>
                                <div class="metric-value">${proxy.latency ? proxy.latency.toFixed(0) + 'ms' : 'N/A'}</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">Uptime</div>
                                <div class="metric-value">${proxy.uptime !== null && proxy.uptime !== undefined ? proxy.uptime.toFixed(1) + '%' : 'N/A'}</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">Profiles</div>
                                <div class="metric-value">${proxy.profiles_count || 0}</div>
                            </div>
                        </div>

                        ${hasIssues ? `
                            <div class="issues-section">
                                <div class="issues-title">⚠️ Problemas detectados:</div>
                                ${proxy.issues.map(issue => {
                                    const isCritical = ['blacklisted', 'blocked', 'bot_detected'].includes(issue);
                                    return `<span class="issue-tag ${isCritical ? 'critical' : ''}">${issue}</span>`;
                                }).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function updateStats(stats) {
            document.getElementById('totalProxies').textContent = stats.total || 0;
            document.getElementById('healthyProxies').textContent = stats.healthy || 0;
            document.getElementById('degradedProxies').textContent = stats.degraded || 0;
            document.getElementById('offlineProxies').textContent = stats.offline || 0;
        }

        async function scanAllProxies() {
            showAlert('info', '🔍 Iniciando escaneo completo de proxies...');
            
            const btn = event.target;
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/proxy-rotation/scan-all`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                showAlert('success', data.message || '✓ Escaneo iniciado en background');
                
                setTimeout(loadProxies, 5000);
            } catch (error) {
                console.error('Error escaneando proxies:', error);
                showAlert('danger', '✗ Error al iniciar escaneo: ' + error.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function getRotationStats() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/proxy-rotation/rotation-stats`);
                const data = await response.json();
                
                let statsHtml = `
                    <strong>📊 Estadísticas de Rotación:</strong><br><br>
                    <strong>Proxies activos:</strong> ${data.active_proxies || 0}<br>
                    <strong>Proxies fallidos:</strong> ${data.failed_proxies || 0}<br>
                    <strong>Total ciudades:</strong> ${data.total_cities || 0}<br>
                    <small>Ver consola para distribución detallada por ciudad</small>
                `;
                
                showAlert('info', statsHtml);
                console.log('📊 Distribución por ciudad:', data.distribution_by_city);
            } catch (error) {
                console.error('Error obteniendo estadísticas:', error);
                showAlert('danger', '✗ Error al obtener estadísticas: ' + error.message);
            }
        }

        async function getAvailableLocations() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/proxy-rotation/available-locations?country=ec`);
                const data = await response.json();
                
                let locationsHtml = `
                    <strong>🗺️ Ubicaciones Disponibles (${data.total || 0}):</strong><br><br>
                    <small>Ver consola para lista completa de ubicaciones</small>
                `;
                
                showAlert('info', locationsHtml);
                console.log('🗺️ Ubicaciones disponibles:', data.locations);
            } catch (error) {
                console.error('Error obteniendo ubicaciones:', error);
                showAlert('danger', '✗ Error al obtener ubicaciones: ' + error.message);
            }
        }

        function showAlert(type, message) {
            const alertsContainer = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = message;
            
            alertsContainer.appendChild(alert);
            
            setTimeout(() => {
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 300);
            }, 5000);
        }

        function updateLastUpdate() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = 
                `Última actualización: ${now.toLocaleString('es-EC')}`;
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Dashboard inicializado');
            loadProxies();
            startAutoRefresh();
        });
    </script>
</body>
</html>
