version: "3.8"

services:
  # Solo el API del Orquestador
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orquestador_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - orquestador_network

networks:
  orquestador_network:
    driver: bridge
